[project]
name = "suryamon-collector"
version = "0.1.0"
description = "SunSpec Modbus collector for the Suryamon solar monitoring stack"
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.6,<3.7",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.scripts]
suryamon-collector = "suryamon_collector.collector:main"
